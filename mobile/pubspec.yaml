name: snapclip
description: "SnapClip — One tap. Right there. Send text snippets to your Windows PC."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.2
  path: ^1.9.0
  web_socket_channel: ^3.0.0
  http: ^1.2.1
  flutter_secure_storage: ^9.0.0
  mobile_scanner: ^5.1.1
  uuid: ^4.3.3
  network_info_plus: ^5.0.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
